<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Horizontal bars of the mean weekly 10-year Treasury return in the worst 10% of equity weeks: CPI &lt;=3% (n=145) +0.33%; CPI &gt;3% (n=194) -0.17%; 10y breakeven bottom tercile (2003-26) (n=49) +0.65%; 10y breakeven top tercile (2003-26) (n=41) +0.30%; Exploratory: 1970-79, CPI &gt;3% (n=65) -0.30%; Exploratory: 2021-26, CPI &gt;3% (n=27) -0.26%.">
<rect width="760" height="290" fill="#fff"/><text x="0.0" y="22.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#000" text-anchor="start" font-weight="700">In the worst equity weeks 10y Treasuries lost 0.17% when CPI was above 3% and gained 0.33% when below</text><text x="0.0" y="44.0" font-family="ui-monospace, Menlo, Monaco, 'Liberation Mono', monospace" font-size="12" fill="#6b6b6b" text-anchor="start">Mean weekly 10y Treasury return (%) in the worst 10% of S&amp;P 500 weeks, by regime. Duration-based proxy from FRED DGS10; S&amp;P 500 from Yahoo Finance; n = tail weeks</text><line x1="368.7" y1="70" x2="368.7" y2="250" stroke="#000"/><text x="0.0" y="87.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#000" text-anchor="start">CPI &lt;=3% (n=145)</text><rect x="368.7" y="76.0" width="163.4" height="16" fill="#000"/><text x="538.1" y="88.0" font-family="ui-monospace, Menlo, Monaco, 'Liberation Mono', monospace" font-size="11" fill="#000" text-anchor="start">+0.33%</text><text x="0.0" y="117.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#000" text-anchor="start">CPI &gt;3% (n=194)</text><rect x="283.6" y="106.0" width="85.1" height="16" fill="#160bff"/><text x="277.6" y="118.0" font-family="ui-monospace, Menlo, Monaco, 'Liberation Mono', monospace" font-size="11" fill="#000" text-anchor="end">−0.17%</text><text x="0.0" y="147.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#000" text-anchor="start">10y breakeven bottom tercile (2003-26) (n=49)</text><rect x="368.7" y="136.0" width="321.3" height="16" fill="#000"/><text x="696.0" y="148.0" font-family="ui-monospace, Menlo, Monaco, 'Liberation Mono', monospace" font-size="11" fill="#000" text-anchor="start">+0.65%</text><text x="0.0" y="177.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#000" text-anchor="start">10y breakeven top tercile (2003-26) (n=41)</text><rect x="368.7" y="166.0" width="150.9" height="16" fill="#160bff"/><text x="525.5" y="178.0" font-family="ui-monospace, Menlo, Monaco, 'Liberation Mono', monospace" font-size="11" fill="#000" text-anchor="start">+0.30%</text><text x="0.0" y="207.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#000" text-anchor="start">Exploratory: 1970-79, CPI &gt;3% (n=65)</text><rect x="220.0" y="196.0" width="148.7" height="16" fill="#000"/><text x="214.0" y="208.0" font-family="ui-monospace, Menlo, Monaco, 'Liberation Mono', monospace" font-size="11" fill="#000" text-anchor="end">−0.30%</text><text x="0.0" y="237.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#000" text-anchor="start">Exploratory: 2021-26, CPI &gt;3% (n=27)</text><rect x="241.9" y="226.0" width="126.8" height="16" fill="#000"/><text x="235.9" y="238.0" font-family="ui-monospace, Menlo, Monaco, 'Liberation Mono', monospace" font-size="11" fill="#000" text-anchor="end">−0.26%</text></svg>
