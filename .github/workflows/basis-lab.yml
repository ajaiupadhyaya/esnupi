name: BASIS Lab

# Drafts one BASIS issue per run and opens it as a DRAFT pull request.
# Nothing is published until you merge the PR. Spend is capped in lab/config.toml
# and tracked in ledger.json on the `lab-state` branch.

on:
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC (09:17 EST)
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: a topic or question to pursue (leave blank to let the scout choose)"
        required: false
        default: ""

concurrency:
  group: basis-lab
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          pip install -r lab/requirements.txt
          # Only the MDX compiler is needed; skip native postinstalls (sharp etc.).
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Load spend ledger
        run: |
          if git fetch --depth=1 origin lab-state 2>/dev/null; then
            git worktree add -B lab-state .lab-state FETCH_HEAD
          else
            git worktree add --orphan -b lab-state .lab-state
          fi
          echo "Ledger:"; cat .lab-state/ledger.json 2>/dev/null || echo "(new)"

      - name: Run pipeline
        id: lab
        working-directory: lab
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASIS_TOPIC: ${{ github.event.inputs.topic }}
          BASIS_LEDGER_PUSH: "1"
        run: python -m basis_lab.run --ledger ../.lab-state/ledger.json
        continue-on-error: true

      - name: Save spend ledger
        if: always()
        working-directory: .lab-state
        run: |
          [ -f ledger.json ] || exit 0
          git add ledger.json
          git -c user.name="basis-lab" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ledger: ${{ steps.lab.outputs.status || 'run' }} ${{ steps.lab.outputs.slug }}" || exit 0
          git push -q origin lab-state

      - name: Open draft PR
        if: steps.lab.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.lab.outputs.branch }}
          RUN_DIR: ${{ steps.lab.outputs.run_dir }}
          TITLE: ${{ steps.lab.outputs.title }}
          NUMBER: ${{ steps.lab.outputs.number }}
        run: |
          git checkout -b "$BRANCH"
          git add "$RUN_DIR" src/content/basis public/basis
          git -c user.name="basis-lab" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "BASIS draft No. $NUMBER: $TITLE"
          git push -q origin "$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "BASIS draft No. $(printf '%03d' "$NUMBER"): $TITLE" \
            --body-file "$RUN_DIR/PR_BODY.md" \
          || echo "::warning::Branch $BRANCH was pushed, but the PR could not be opened. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open it from the branch."

      - name: Keep run files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basis-lab-run
          path: |
            lab/runs/
            !lab/runs/**/data/
          retention-days: 30
          if-no-files-found: ignore
